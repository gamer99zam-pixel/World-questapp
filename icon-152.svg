  <text x="76" y="98" font-size="83" text-anchor="middle" dominant-baseline="middle">👑</text>
  <!-- W letter -->
  <text x="76" y="133" font-size="27" font-weight="900" text-anchor="middle" fill="url(#crown)" font-family="Arial,sans-serif">WQ</text>

<svg width="96" height="96" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0b2e"/>
      <stop offset="100%" style="stop-color:#0f0f1a"/>
    </linearGradient>
    <linearGradient id="crown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="96" height="96" rx="19" fill="url(#bg)"/>
  <!-- Crown emoji-style -->
  <text x="48" y="62" font-size="52" text-anchor="middle" dominant-baseline="middle">👑</text>
  <!-- W letter -->
  <text x="48" y="84" font-size="17" font-weight="900" text-anchor="middle" fill="url(#crown)" font-family="Arial,sans-serif">WQ</text>
</svg>